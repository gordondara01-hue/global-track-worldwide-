<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlobalTrack – Worldwide Package Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Leaflet essentials (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;outline:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-map-pane svg{z-index:200}
.leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-control-attribution{font-size:10px;background:#fffc;padding:0 5px;color:#333}
.leaflet-bar{margin:12px;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0003}
.leaflet-bar a{display:block;width:32px;height:32px;line-height:32px;text-align:center;background:#fff;color:#111;text-decoration:none;font-weight:700;border-bottom:1px solid #ddd}
.leaflet-bar a:last-child{border:0}
.crosshair .leaflet-container{cursor:crosshair}

:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pri:#2563eb;--hd:#0b1220;--in:#f8fafc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1c;--card:#121a2b;--tx:#e8edf7;--mut:#93a1ba;--bd:#233049;--in:#0d1524}}
:root[data-theme="dark"]{--bg:#0a0f1c;--card:#121a2b;--tx:#e8edf7;--mut:#93a1ba;--bd:#233049;--in:#0d1524}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:2000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:2001}
.bar{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:grid;place-items:center;font-style:normal;font-size:16px}
nav{display:flex;gap:6px}
nav button{background:none;border:0;color:#cbd5e1;font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on,nav button:hover{background:#ffffff1a;color:#fff}
main{max-width:1200px;margin:auto;padding:20px}
.hero{background:radial-gradient(1200px 400px at 70% -10%,#1d4ed8aa,transparent),var(--hd);color:#fff;border-radius:20px;padding:44px 28px;text-align:center;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px);letter-spacing:-.03em;font-weight:800}
.hero p{margin:0 auto 24px;color:#b6c2d9;max-width:520px}
.search{display:flex;gap:8px;max-width:560px;margin:auto}
.search input{flex:1;min-width:0;padding:15px 18px;border-radius:12px;border:0;font:600 16px Inter,sans-serif;text-transform:uppercase;outline:none}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:#dc2626}.btn.sm{padding:6px 10px;font-size:12px}
.chips{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#93a4c0}
.chips b{cursor:pointer;color:#fff;background:#ffffff1f;padding:3px 10px;border-radius:99px;font-weight:600}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 1px 3px #0000000d}
.card h3{margin:0 0 14px;font-size:15px}
#map{height:460px;border-radius:12px;background:linear-gradient(#bcd6ea,#d6e6f2);z-index:1}
@media(max-width:600px){#map{height:340px}.hero{padding:32px 18px}.bar{padding:12px 14px}main{padding:14px}}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em}
.s-Pending{background:#fef3c7;color:#92400e}.s-In\ Transit{background:#dbeafe;color:#1e40af}.s-Delivered{background:#dcfce7;color:#166534}.s-Exception{background:#fee2e2;color:#991b1b}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.kv small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv div{font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px;border-left:2px solid var(--bd);margin-left:6px}
.tl li:last-child{border-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--mut);border:2px solid var(--card)}
.tl li:first-child::before{background:var(--pri);box-shadow:0 0 0 4px #2563eb33}
.tl b{display:block}.tl span{color:var(--mut);font-size:13px}
.err{background:#fee2e2;color:#991b1b;padding:14px 18px;border-radius:12px;text-align:center;font-weight:600}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px #0006}
.pin.cur{background:#2563eb;width:24px;height:24px;animation:pu 1.8s infinite}
.pin.o{background:#16a34a}.pin.d{background:#0f172a}
@keyframes pu{0%{box-shadow:0 0 0 0 #2563ebaa}100%{box-shadow:0 0 0 18px #2563eb00}}
input,select{font:500 14px Inter,sans-serif;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);width:100%}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.sel td{background:#2563eb14}
td .act{display:flex;gap:6px}
.login{max-width:380px;margin:60px auto;text-align:center}
.login input{margin:14px 0}
.banner{background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:5000;box-shadow:0 8px 24px #0006;max-width:90vw}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" onclick="go('track')"><i>🌍</i>GlobalTrack</div>
  <nav><button id="n-track" onclick="go('track')">Track</button><button id="n-admin" onclick="go('admin')">Founder</button></nav>
</div></header>
<main id="app"></main>
<footer>© 2026 GlobalTrack · Map data © OpenStreetMap contributors</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const PASSWORD='founder2026', KEY='globaltrack_pkgs_v1', STATUSES=['Pending','In Transit','Delivered','Exception'];
const CITIES={'Shanghai':[31.23,121.47],'Los Angeles':[34.05,-118.24],'London':[51.51,-0.13],'Sydney':[-33.87,151.21],'Nairobi':[-1.29,36.82],'Berlin':[52.52,13.4],'New York':[40.71,-74.0],'Dubai':[25.2,55.27],'Frankfurt':[50.11,8.68],'Singapore':[1.35,103.82],'São Paulo':[-23.55,-46.63],'Tokyo':[35.68,139.69],'Cairo':[30.04,31.24],'Mumbai':[19.08,72.88],'Toronto':[43.65,-79.38],'Johannesburg':[-26.2,28.05]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const day=n=>Date.now()-n*864e5;
const loc=n=>({name:n,lat:CITIES[n][0],lng:CITIES[n][1]});
const ev=(n,s,note,d,ll)=>({ts:day(d),status:s,note,name:n,lat:(ll||CITIES[n])[0],lng:(ll||CITIES[n])[1]});

function seed(){return[
 {id:'GT1001',desc:'Electronics – 2 boxes',status:'In Transit',origin:loc('Shanghai'),dest:loc('Los Angeles'),eta:new Date(Date.now()+4*864e5).toISOString().slice(0,10),
  history:[ev('Shanghai','Pending','Shipment created',6),ev('Shanghai','In Transit','Departed origin facility',5),ev('Tokyo','In Transit','Transit hub scan',3),ev('North Pacific Ocean','In Transit','On cargo flight over the Pacific',1,[44,-170])]},
 {id:'GT2002',desc:'Documents – express',status:'Delivered',origin:loc('London'),dest:loc('Sydney'),eta:new Date(Date.now()-864e5).toISOString().slice(0,10),
  history:[ev('London','Pending','Shipment created',9),ev('London','In Transit','Departed origin facility',8),ev('Dubai','In Transit','Arrived at hub',6),ev('Singapore','In Transit','Departed hub',4),ev('Sydney','Delivered','Delivered and signed for',2)]},
 {id:'GT3003',desc:'Medical supplies',status:'Pending',origin:loc('Nairobi'),dest:loc('Berlin'),eta:new Date(Date.now()+8*864e5).toISOString().slice(0,10),
  history:[ev('Nairobi','Pending','Awaiting pickup',0.3)]},
 {id:'GT4004',desc:'Fashion – 5 cartons',status:'Exception',origin:loc('New York'),dest:loc('Dubai'),eta:new Date(Date.now()+3*864e5).toISOString().slice(0,10),
  history:[ev('New York','Pending','Shipment created',7),ev('New York','In Transit','Departed origin facility',6),ev('Frankfurt','Exception','Held at customs – documents required',2)]}
];}

let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
 return mem||(mem=seed(),save(mem),mem)}
function save(p){mem=p;try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
function resetDemo(){save(seed());go('admin')}

let pkgs=load(), view='track', authed=false, sel=null, editId=null, delId=null, M=null, LG=null;
const cur=p=>p.history[p.history.length-1]||p.origin;
const find=id=>pkgs.find(p=>p.id===id);
const badge=s=>`<span class="badge s-${s}">${esc(s)}</span>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function go(v){view=v;if(location.hash!=='#'+v)location.hash=v;render()}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if((v==='track'||v==='admin')&&v!==view){view=v;render()}});

/* ---------- map ---------- */
function mkMap(onClick){
 if(M){M.remove();M=null}
 M=L.map('map',{worldCopyJump:true,minZoom:2,maxBounds:[[-85,-540],[85,540]]}).setView([25,10],2);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(M);
 LG=L.layerGroup().addTo(M);
 if(onClick)M.on('click',e=>onClick(e.latlng.wrap()));
}
const icon=c=>L.divIcon({className:'',html:`<div class="pin ${c}"></div>`,iconSize:[24,24],iconAnchor:[12,12]});
function draw(p,fit){
 if(!M)return; LG.clearLayers();
 if(!p){return}
 const pts=p.history.map(h=>[h.lat,h.lng]), c=cur(p);
 if(pts.length>1)L.polyline(pts,{color:'#2563eb',weight:4,opacity:.9}).addTo(LG);
 p.history.slice(0,-1).forEach(h=>L.circleMarker([h.lat,h.lng],{radius:4,color:'#2563eb',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(LG));
 if(p.status!=='Delivered')L.polyline([[c.lat,c.lng],[p.dest.lat,p.dest.lng]],{color:'#64748b',weight:3,dashArray:'6 8'}).addTo(LG);
 L.marker([p.origin.lat,p.origin.lng],{icon:icon('o'),interactive:false}).addTo(LG);
 L.marker([p.dest.lat,p.dest.lng],{icon:icon('d'),interactive:false}).addTo(LG);
 L.marker([c.lat,c.lng],{icon:icon('cur'),interactive:false,zIndexOffset:1000}).addTo(LG);
 if(fit)M.fitBounds(L.latLngBounds([...pts,[p.dest.lat,p.dest.lng]]).pad(.25),{maxZoom:5});
}

/* ---------- tracking ---------- */
const info=p=>{const c=cur(p);return `<div class="row">${badge(p.status)}<small style="color:var(--mut)">${esc(p.id)}</small></div>
 <div class="kv"><div><small>Origin</small>${esc(p.origin.name)}</div><div><small>Destination</small>${esc(p.dest.name)}</div>
 <div><small>Current location</small>${esc(c.name)}</div><div><small>Est. delivery</small>${p.status==='Delivered'?'Delivered':esc(p.eta||'—')}</div></div>
 <div style="color:var(--mut);font-size:13px">${esc(p.desc||'')}</div>`};
const timeline=p=>`<ul class="tl">${[...p.history].reverse().map(h=>`<li><b>${esc(h.status)} · ${esc(h.name)}</b><span>${esc(h.note||'')}</span><br><span>${fmt(h.ts)}</span></li>`).join('')}</ul>`;

function renderTrack(q){
 const p=q?find(q.trim().toUpperCase()):null;
 $app.innerHTML=`<section class="hero"><h1>Track your package, anywhere on Earth</h1><p>Enter your tracking number for live location, route and delivery estimate.</p>
 <div class="search"><input id="q" placeholder="e.g. GT1001" value="${esc(q||'')}" autocomplete="off"><button class="btn" id="go">Track</button></div>
 <div class="chips">Try: ${pkgs.slice(0,4).map(x=>`<b onclick="doTrack('${esc(x.id)}')">${esc(x.id)}</b>`).join('')}</div></section>
 ${q&&!p?`<div class="err">No package found for “${esc(q)}”. Please check the number and try again.</div>`:''}
 ${p?`<div class="grid"><div class="card"><div id="map"></div></div><div style="display:flex;flex-direction:column;gap:20px"><div class="card"><h3>Shipment details</h3>${info(p)}</div><div class="card"><h3>Tracking history</h3>${timeline(p)}</div></div></div>`:''}`;
 $('#go').onclick=()=>doTrack($('#q').value);
 $('#q').onkeydown=e=>{if(e.key==='Enter')doTrack(e.target.value)};
 if(p){mkMap();draw(p,true)}else if(M){M.remove();M=null}
}
function doTrack(v){pkgs=load();renderTrack(v)}
const $=s=>document.querySelector(s); const $app=document.getElementById('app');

/* ---------- admin ---------- */
function renderLogin(){
 $app.innerHTML=`<div class="card login"><div style="font-size:34px">🔐</div><h2 style="margin:6px 0">Founder Control Panel</h2><div style="color:var(--mut)">Enter the founder password to continue.</div>
 <input id="pw" type="password" placeholder="Password"><button class="btn" id="li" style="width:100%">Sign in</button></div>`;
 const t=()=>{if($('#pw').value===PASSWORD){authed=true;renderAdmin()}else toast('Incorrect password')};
 $('#li').onclick=t;$('#pw').onkeydown=e=>{if(e.key==='Enter')t()};
}
const opts=(list,v)=>list.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');

function renderAdmin(){
 if(!authed)return renderLogin();
 pkgs=load();
 $app.innerHTML=`<div class="row" style="margin-bottom:16px"><h2 style="margin:0">Founder Control Panel</h2><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="resetDemo()">Reset demo data</button><button class="btn ghost sm" onclick="authed=false;sel=null;renderLogin()">Sign out</button></div></div>
 <div class="grid"><div class="card"><div id="banner"></div><div id="map"></div></div>
 <div style="display:flex;flex-direction:column;gap:20px"><div class="card" id="move"></div><div class="card" id="form"></div></div></div>
 <div class="card" style="margin-top:20px"><div class="tw" id="tbl"></div></div>`;
 mkMap(onMapClick); panels(true);
}
function panels(fit){tbl();banner();movePanel();formPanel();draw(find(sel),fit)}
function banner(){const p=find(sel);$('#banner').innerHTML=p?`<div class="banner">📍 Click anywhere on the map to move ${esc(p.id)}</div>`:`<div class="banner" style="background:#475569">Select a package from the table, then click the map to move it.</div>`}
function tbl(){
 $('#tbl').innerHTML=`<div class="row" style="margin-bottom:8px"><h3 style="margin:0">All packages (${pkgs.length})</h3></div><table><thead><tr><th>Tracking</th><th>Route</th><th>Status</th><th>Current</th><th>ETA</th><th></th></tr></thead><tbody>${pkgs.map(p=>`<tr class="${p.id===sel?'sel':''}"><td><b>${esc(p.id)}</b></td><td>${esc(p.origin.name)} → ${esc(p.dest.name)}</td><td>${badge(p.status)}</td><td>${esc(cur(p).name)}</td><td>${esc(p.eta||'—')}</td>
 <td><div class="act"><button class="btn sm" onclick="pick('${p.id}')">Select</button><button class="btn ghost sm" onclick="editId='${p.id}';formPanel()">Edit</button>${delId===p.id?`<button class="btn red sm" onclick="del('${p.id}')">Confirm</button>`:`<button class="btn ghost sm" onclick="delId='${p.id}';tbl();setTimeout(()=>{delId=null;tbl()},3500)">Delete</button>`}</div></td></tr>`).join('')||'<tr><td colspan="6">No packages yet.</td></tr>'}</tbody></table>`;
}
function pick(id){sel=id;panels(true);window.scrollTo({top:0,behavior:'smooth'})}
function del(id){pkgs=pkgs.filter(p=>p.id!==id);save(pkgs);if(sel===id)sel=null;if(editId===id)editId=null;delId=null;panels(false);toast('Package deleted')}
function movePanel(){
 const p=find(sel);
 $('#move').innerHTML=p?`<h3>Move ${esc(p.id)}</h3><div class="frm"><div><label>Status after move</label><select id="mst">${opts(STATUSES,p.status==='Pending'?'In Transit':p.status)}</select></div><div><label>Note</label><input id="mnote" placeholder="e.g. Arrived at hub"></div></div><p style="color:var(--mut);font-size:13px;margin:12px 0 0">Now at <b>${esc(cur(p).name)}</b>. Every move is logged in the package history.</p>`
 :`<h3>Map control</h3><p style="color:var(--mut);margin:0">No package selected.</p>`;
}
async function geo(lat,lng){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),2500);
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat=${lat}&lon=${lng}`,{signal:c.signal});const j=await r.json();
  const a=j.address||{};const n=a.city||a.town||a.village||a.county||a.state||'';return n?`${n}${a.country?', '+a.country:''}`:(j.display_name||null)}catch(e){return null}finally{clearTimeout(t)}
}
async function onMapClick(ll){
 const p=find(sel); if(!p){toast('Select a package first');return}
 const st=$('#mst')?.value||'In Transit', note=$('#mnote')?.value||'Location updated by founder';
 const name=(await geo(ll.lat,ll.lng))||`${ll.lat.toFixed(2)}°, ${ll.lng.toFixed(2)}°`;
 p.history.push({ts:Date.now(),status:st,note,name,lat:+ll.lat.toFixed(5),lng:+ll.lng.toFixed(5)});
 p.status=st; save(pkgs); panels(false); toast(`Moved ${p.id} to ${name}`);
}
function formPanel(){
 const p=editId?find(editId):null, cn=Object.keys(CITIES);
 $('#form').innerHTML=`<h3>${p?'Edit '+esc(p.id):'Create new package'}</h3><div class="frm">
 <div><label>Tracking number</label><input id="fid" placeholder="Auto" value="${p?esc(p.id):''}" ${p?'disabled':''}></div>
 <div><label>Status</label><select id="fst">${opts(STATUSES,p?.status||'Pending')}</select></div>
 <div><label>Origin</label><select id="for" ${p?'disabled':''}>${opts(cn,p?.origin.name)}</select></div>
 <div><label>Destination</label><select id="fde">${opts(cn,p?.dest.name||'London')}</select></div>
 <div><label>Est. delivery</label><input id="feta" type="date" value="${esc(p?.eta||'')}"></div>
 <div><label>Description</label><input id="fdesc" value="${esc(p?.desc||'')}"></div>
 <div class="full row"><button class="btn" onclick="saveForm()">${p?'Save changes':'Create package'}</button>${p?'<button class="btn ghost" onclick="editId=null;formPanel()">Cancel</button>':''}</div></div>`;
}
function saveForm(){
 const p=editId?find(editId):null, g=i=>$(i).value.trim();
 if(p){const d=g('#fde');p.dest=loc(d);p.status=g('#fst');p.eta=g('#feta');p.desc=g('#fdesc');toast('Saved')}
 else{
  let id=g('#fid').toUpperCase()||'GT'+Math.floor(1000+Math.random()*9000);
  if(find(id))return toast('That tracking number already exists');
  const o=g('#for'),d=g('#fde'),st=g('#fst');
  pkgs.push({id,desc:g('#fdesc'),status:st,origin:loc(o),dest:loc(d),eta:g('#feta'),history:[ev(o,st,'Shipment created',0)]});
  sel=id;toast('Created '+id)}
 save(pkgs);editId=null;panels(true);
}

function render(){
 $('#n-track').className=view==='track'?'on':'';$('#n-admin').className=view==='admin'?'on':'';
 if(M){M.remove();M=null}
 view==='admin'?renderAdmin():renderTrack();
}
const h0=location.hash.slice(1);if(h0==='admin')view='admin';
render();
</script>
